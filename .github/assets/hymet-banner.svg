<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">HYMET: Where HYPE launches</title>
  <desc id="d">HYPE-only token launchpad on Solana. A bonding curve rises to graduation and continues into a locked DAMM v2 pool.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e0d"/>
      <stop offset="0.55" stop-color="#101412"/>
      <stop offset="1" stop-color="#0c1513"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#8ff5db" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8ff5db" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ff5db" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#8ff5db"/>
      <stop offset="1" stop-color="#b1ed8b"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff5db" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8ff5db" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- Bonding curve (convex price path) to graduation, then the flat, locked DAMM v2 pool -->
  <path d="M700 330 C 860 326, 950 300, 1020 250 S 1115 140, 1150 92 L 1150 330 Z" fill="url(#fill)"/>
  <path d="M700 330 C 860 326, 950 300, 1020 250 S 1115 140, 1150 92" fill="none" stroke="url(#curve)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M1150 92 H 1236" fill="none" stroke="#b1ed8b" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g fill="#0f1412" stroke="#8ff5db" stroke-width="2">
    <circle cx="872" cy="322" r="5"/>
    <circle cx="977" cy="283" r="5"/>
    <circle cx="1063" cy="198" r="5"/>
  </g>
  <circle cx="1150" cy="92" r="9" fill="#b1ed8b"/>
  <circle cx="1150" cy="92" r="18" fill="none" stroke="#b1ed8b" stroke-opacity="0.35" stroke-width="2"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#93a19a" font-size="13" letter-spacing="1.5">
    <text x="872" y="350" text-anchor="middle">25%</text>
    <text x="977" y="311" text-anchor="middle">50%</text>
    <text x="1063" y="226" text-anchor="middle">75%</text>
    <text x="1150" y="62" text-anchor="middle" fill="#b1ed8b" font-weight="600">GRADUATION → DAMM v2</text>
  </g>

  <!-- Mark (from public/hymet-logo.svg) and wordmark -->
  <g transform="translate(70 118) scale(1.3)">
    <path d="M16 50 Q34 17 48 45 Q57 65 83 24 Q72 60 57 75 Q44 89 32 63 Q27 51 16 50 Z" fill="#8FF5DB"/>
    <circle cx="83" cy="24" r="4" fill="#C2FFF0"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="208" y="214" fill="#edf3f6" font-size="92" font-weight="800" letter-spacing="10">HYMET</text>
    <text x="212" y="258" fill="#8ff5db" font-size="26" font-weight="600" letter-spacing="1">Where HYPE launches</text>
    <text x="212" y="298" fill="#93a19a" font-size="17" letter-spacing="0.5">HYPE-only token launchpad on Solana</text>
    <text x="212" y="324" fill="#93a19a" font-size="17" letter-spacing="0.5">Meteora DBC → DAMM v2 · on-chain fee distribution</text>
  </g>
</svg>
