[package]
name = "hymet-rewards-distributor"
version = "0.1.0"
description = "Noncustodial HYPE fee settlement and passive holder rewards for HYMET"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hymet_rewards_distributor"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1" }
anchor-spl = { version = "=0.31.1", features = ["associated_token", "token"] }
